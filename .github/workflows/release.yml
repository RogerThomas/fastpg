# Releases with Release Please (release-please-config.json): on every push to main it opens or
# updates a release PR (the next version, from the Conventional Commits since the last release, in
# native/Cargo.toml and native/Cargo.lock, where maturin reads it from, and CHANGELOG.md); merging
# that PR tags the release and creates the GitHub release, and the same run then builds, tests and
# publishes it. (A tag made with the workflow's own token can't trigger another workflow, and PyPI
# trusts this file by name, so it all happens here.)
#
# Builds the wheels and the sdist in one job per runner image (Linux x86_64, which also builds the
# sdist, Linux aarch64, macOS arm64 and macOS x86_64), each uploaded with its SHA-256 as soon as
# it's built, and tests them in the same job (.github/scripts/test-wheel.sh: tests/smoke.py, then
# the test suite against the installed wheel), each wheel on the Python it's for, every Python at
# once, each serially against a server of its own; then the `timing` tests alone, on Python 3.14.
# When a release was created, once every build and test passed,
# it publishes them all to PyPI with trusted publishing, checking first that each SHA-256 still
# matches: what's published is exactly what was tested.
# Manual runs build and test only, and so do pull requests that change the packaging (the
# `packaging` job lists the files) or have the `full-ci` label; other pull requests skip the
# builds. The documentation site is deployed by docs.yml, on every push to main that changes it
# (the release's version bump included).
#
# Wheels for CPython 3.13, 3.14 and 3.15 and the free-threaded 3.14t and 3.15t (which fastpg runs
# with the GIL back on; no 3.13t, where free threading was experimental: ADR 0011), on Linux
# (manylinux_2_28 and musllinux_1_2, x86_64 and aarch64) and macOS (x86_64 and arm64): the
# platforms ADR 0011 supports; not Windows, whose default event loop has no add_reader. Not abi3: the extension builds Structs, tuples and lists in place through CPython's
# object layouts (native/src/decode.rs, structs.rs), outside the limited API, and an abi3 wheel
# doesn't load on a free-threaded Python anyway.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    # labeled: adding the `full-ci` label starts a run that builds and tests everything.
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  MATURIN_VERSION: v1.15.0
  UV_VERSION: 0.13.0
  # The one Python each set of wheels runs the `timing` tests on (tests that wait in real time
  # for timeouts, keepalives and stalls), after the rest, alone: .python-version's, with the
  # GIL. Every Python runs the smoke test and the rest of the suite.
  FASTPG_TIMING_PYTHON: "3.14"

jobs:
  release-please:
    name: Release PR or release
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # the release, its tag and the release PR's branch
      pull-requests: write # the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Optional: with a GitHub App's token (the RELEASE_PLEASE_APP_CLIENT_ID variable and the
      # RELEASE_PLEASE_APP_PRIVATE_KEY secret), the release PR runs the PR checks, which a PR made
      # with the workflow's own token doesn't; without them, the workflow's own token.
      - id: app-token
        if: vars.RELEASE_PLEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      # The release first, then the next release PR: if that second step fails (e.g. a GitHub
      # API error), the release still gets built and published.
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true
      - continue-on-error: true
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

  # On a pull request: whether to build and test the wheels and the sdist. Only if it changes the
  # packaging (the files below) or has the `full-ci` label. Not a paths filter, which can't be
  # combined with a label. Skipped on pushes to main and manual runs, which build as before.
  packaging:
    name: Packaging changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.diff.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          FULL_CI_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          if [ "$FULL_CI_LABEL" = true ]; then
            build=true
          elif git diff --name-only "$BASE...HEAD" | grep -qE \
            '^(native/(Cargo\.toml|Cargo\.lock|build\.rs)|pyproject\.toml|uv\.lock|rust-toolchain\.toml|\.github/workflows/release\.yml|\.github/scripts/.+)$'; then
            build=true
          else
            build=false
          fi
          echo "build=$build" | tee -a "$GITHUB_OUTPUT"

  # Linux, a job per architecture, each on a runner of its own (no emulation): on x86_64 the sdist
  # first, then the manylinux and musllinux wheels, each uploaded with its SHA-256 as soon as it's
  # built; then each is tested on the same machine. A wheel is tested only if its build passed,
  # and every step runs even if an earlier one failed (the job then fails).
  linux:
    name: Build and test ${{ matrix.platform.name }}
    needs: [release-please, packaging]
    if: >-
      ${{ !cancelled() && needs.release-please.result != 'failure' &&
      (github.event_name != 'push' || needs.release-please.outputs.release_created == 'true') &&
      (github.event_name != 'pull_request' || needs.packaging.outputs.build == 'true') }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # The images are the ones maturin-action picks for each, pinned. The manylinux ones hold
        # every CPython (cp313 to cp315t, on PATH as python3.13 ... python3.15t); for musl,
        # maturin cross-compiles with its own sysconfig data.
        platform:
          - name: Linux x86_64
            runner: ubuntu-24.04
            arch: x86_64
            sdist: true
            manylinux: quay.io/pypa/manylinux_2_28_x86_64@sha256:4131ddd7acb9c6c966af02fe7e71edc51e078c2d41f475966697676430bfa2ae # latest
            musllinux: ghcr.io/rust-cross/rust-musl-cross@sha256:ce75e9174325d4fbb3de85c309e2d7ca29f7500169bc4b5d2c611ff7e86d549a # x86_64-musl
          - name: Linux aarch64
            runner: ubuntu-24.04-arm
            arch: aarch64
            manylinux: quay.io/pypa/manylinux_2_28_aarch64@sha256:abd1230aa9e4058a74b89d27cd14ba18c0db036d7bfe6e6f219a29ea63c24eb6 # latest
            musllinux: ghcr.io/rust-cross/rust-musl-cross@sha256:ecae5dd62d1c938c14f8071d36c16fa699860aace03bfb5284fb1216474d2643 # aarch64-musl
    env:
      ALPINE_PYTHON_314: python@sha256:f6a589d43c42b9e7f7dc67a12d37132491f362859a5d750607710cc56da3bc72 # 3.14.8-alpine
      # Each Python's tests against a TLS-only server too (.github/scripts/with-server.sh).
      FASTPG_TEST_TLS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false # no caches in a workflow that publishes
      # The sdist and the wheel built from it first, on the host: the wheel builds below run in
      # containers, as root. Each build has a directory of its own, uploaded as its own artifact.
      # maturin reads the crate's metadata with cargo.
      - name: Install Rust (rust-toolchain.toml)
        if: matrix.platform.sdist
        run: rustup toolchain install
      - name: Build the sdist
        id: sdist
        if: ${{ !cancelled() && matrix.platform.sdist }}
        run: uv build --sdist --out-dir dist/sdist
      - name: Record the sdist's SHA-256
        id: sdist-sha256
        if: ${{ !cancelled() && steps.sdist.outcome == 'success' }}
        run: sh .github/scripts/sha256.sh record dist/sdist/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.sdist-sha256.outcome == 'success' }}
        with:
          name: dist-sdist
          path: dist/sdist/
          if-no-files-found: error
      # From the sdist alone: which fails if the sdist is missing a file.
      - name: Build a wheel from the sdist
        id: sdist-wheel
        if: ${{ !cancelled() && steps.sdist.outcome == 'success' }}
        run: uv build --python 3.14 --wheel --out-dir wheel dist/sdist/*.tar.gz
      - name: Build manylinux
        id: manylinux
        if: ${{ !cancelled() }}
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.platform.arch }}-unknown-linux-gnu
          manylinux: "2_28"
          container: ${{ matrix.platform.manylinux }}
          # Caches compiled crates between runs, on pull requests only: no caches in a build that
          # may be published.
          sccache: ${{ github.event_name == 'pull_request' }}
          # Listed rather than --find-interpreter, which would also take the images' PyPy.
          args: >-
            --release --locked --out dist/manylinux
            --interpreter python3.13 python3.14 python3.14t python3.15 python3.15t
      - name: Record the manylinux wheels' SHA-256
        id: manylinux-sha256
        if: ${{ !cancelled() && steps.manylinux.outcome == 'success' }}
        run: sh .github/scripts/sha256.sh record dist/manylinux/*.whl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.manylinux-sha256.outcome == 'success' }}
        with:
          name: dist-${{ matrix.platform.arch }}-unknown-linux-gnu
          path: dist/manylinux/
          if-no-files-found: error
      - name: Build musllinux
        id: musllinux
        if: ${{ !cancelled() }}
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.platform.arch }}-unknown-linux-musl
          manylinux: musllinux_1_2
          container: ${{ matrix.platform.musllinux }}
          sccache: ${{ github.event_name == 'pull_request' }}
          args: >-
            --release --locked --out dist/musllinux
            --interpreter python3.13 python3.14 python3.14t python3.15 python3.15t
      - name: Record the musllinux wheels' SHA-256
        id: musllinux-sha256
        if: ${{ !cancelled() && steps.musllinux.outcome == 'success' }}
        run: sh .github/scripts/sha256.sh record dist/musllinux/*.whl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.musllinux-sha256.outcome == 'success' }}
        with:
          name: dist-${{ matrix.platform.arch }}-unknown-linux-musl
          path: dist/musllinux/
          if-no-files-found: error
      # A server and a TLS-only one for each Python (docker-compose.yml's; set N on ports
      # 55432+N and 55532+N), which each set of wheels below is tested against in turn.
      - name: Start PostgreSQL
        if: ${{ !cancelled() }}
        run: sh .github/scripts/test-servers.sh default default default default default
      - name: Test the wheel built from the sdist
        if: ${{ !cancelled() && steps.sdist-wheel.outcome == 'success' }}
        env:
          UV_PYTHON_PREFERENCE: only-managed
          FASTPG_TIMING_PYTHON: "" # they run on the manylinux and musllinux wheels
        run: sh .github/scripts/test-wheel.sh wheel 3.14
      - name: Test the manylinux wheels
        if: ${{ !cancelled() && steps.manylinux.outcome == 'success' }}
        # On the Pythons uv downloads (python-build-standalone's). Fresh venvs: not the ones the
        # sdist's wheel was tested in.
        env:
          UV_PYTHON_PREFERENCE: only-managed
        run: |
          rm -rf .venv-*
          sh .github/scripts/test-wheel.sh dist/manylinux 3.13 3.14 3.14t 3.15 3.15t
      - name: Test the musllinux wheels (in Alpine)
        if: ${{ !cancelled() && steps.musllinux.outcome == 'success' }}
        # Last: the container runs as root and leaves root-owned files in the checkout. On the
        # host's network, so the servers' ports are on localhost (the name the TLS certificate is
        # for). 3.14 on the Alpine image's Python (uv's default preference takes it, as the image
        # has no managed 3.14), the others on ones uv downloads into the same image (there's no
        # free-threaded image). The tests that start servers of their own do it through the
        # host's Docker socket (docker-cli for the ones that kill a server); testcontainers is
        # told they're on localhost, as inside a container it would otherwise connect through the
        # Docker gateway (172.17.0.1). The repo is mounted at its host path, the wheels
        # read-only. The host's venvs are removed first: they're glibc's, and the test script
        # would reuse them.
        run: |
          rm -rf .venv-*
          docker run --rm --network host \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$PWD:$PWD" --volume "$PWD/dist/musllinux:$PWD/dist/musllinux:ro" --workdir "$PWD" \
            --env UV_VERSION --env FASTPG_TEST_TLS --env FASTPG_TIMING_PYTHON \
            --env TESTCONTAINERS_CONNECTION_MODE=docker_host --env TESTCONTAINERS_HOST_OVERRIDE=localhost \
            "$ALPINE_PYTHON_314" sh -euxc '
              apk add --no-cache build-base docker-cli
              pip install --root-user-action=ignore --disable-pip-version-check "uv==$UV_VERSION"
              sh .github/scripts/test-wheel.sh dist/musllinux 3.13 3.14 3.14t 3.15 3.15t
            '
      - name: Show the servers' logs
        if: failure()
        run: |
          for n in 0 1 2 3 4; do
            docker compose --project-name "fastpg-test-$n" --profile tls logs postgres postgres-tls
          done

  # macOS, a job per architecture, each built natively on a runner of its own, uploaded with its
  # SHA-256, then tested there, as on Linux.
  macos:
    name: Build and test ${{ matrix.platform.name }}
    needs: [release-please, packaging]
    if: >-
      ${{ !cancelled() && needs.release-please.result != 'failure' &&
      (github.event_name != 'push' || needs.release-please.outputs.release_created == 'true') &&
      (github.event_name != 'pull_request' || needs.packaging.outputs.build == 'true') }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS arm64
            runner: macos-15
            target: aarch64-apple-darwin
          - name: macOS x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
    env:
      # PostgreSQLs of the runner's own (no Docker on macOS): no TLS tests (skipped), and not the
      # test files that start server containers of their own (pgbouncer, and the two that pause
      # and kill one).
      PYTEST_ADDOPTS: >-
        --ignore tests/test_pgbouncer.py
        --ignore tests/test_network_server.py --ignore tests/test_network_stall.py
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A wheel for each of these Pythons, which maturin is given by path.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python313
        with:
          python-version: "3.13"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python314
        with:
          python-version: "3.14"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python314t
        with:
          python-version: "3.14t"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python315
        with:
          python-version: "3.15"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python315t
        with:
          python-version: "3.15t"
      - name: Build
        id: build
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.platform.target }}
          # As the Linux builds: pull requests only.
          sccache: ${{ github.event_name == 'pull_request' }}
          args: >-
            --release --locked --out dist --interpreter
            ${{ steps.python313.outputs.python-path }}
            ${{ steps.python314.outputs.python-path }}
            ${{ steps.python314t.outputs.python-path }}
            ${{ steps.python315.outputs.python-path }}
            ${{ steps.python315t.outputs.python-path }}
      - name: Record the SHA-256
        id: sha256
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: sh .github/scripts/sha256.sh record dist/*.whl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.sha256.outcome == 'success' }}
        with:
          name: dist-${{ matrix.platform.target }}
          path: dist/
          if-no-files-found: error
      # One for each Python, on ports 55432 to 55436.
      - name: Start PostgreSQL 18
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          brew install postgresql@18
          PATH="$(brew --prefix postgresql@18)/bin:$PATH"
          for n in 0 1 2 3 4; do
            sh .github/scripts/native-postgres.sh "$RUNNER_TEMP/postgres-$n" $((55432 + n))
          done
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false # no caches in a workflow that publishes
      - name: Test
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        # On the Pythons uv downloads (python-build-standalone's), as on Linux: with setup-python's,
        # a request for 3.14 could find its free-threaded 3.14t, which can't load a cp314 wheel.
        env:
          UV_PYTHON_PREFERENCE: only-managed
        run: sh .github/scripts/test-wheel.sh dist 3.13 3.14 3.14t 3.15 3.15t
      - name: Show the servers' logs
        if: failure()
        run: |
          for n in 0 1 2 3 4; do
            echo "::group::Server $n"
            cat "$RUNNER_TEMP/postgres-$n/server.log"
            echo "::endgroup::"
          done

  publish:
    name: Publish to PyPI
    if: needs.release-please.outputs.release_created == 'true'
    needs:
      - release-please
      - linux
      - macos
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/fastpg/
    permissions:
      id-token: write # PyPI trusted publishing
    outputs:
      python_version: ${{ steps.version.outputs.python_version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Check every file is what was built and tested
        working-directory: dist
        run: |
          ls -l
          for file in *.whl *.tar.gz; do
            test -f "$file.sha256" || { echo "::error::No SHA-256 recorded for $file"; exit 1; }
          done
          sha256sum --check --strict -- *.sha256
          mkdir ../checksums
          mv -- *.sha256 ../checksums/ # only the distributions are uploaded
      - name: Check the release's version is the version built
        id: version
        env:
          VERSION: ${{ needs.release-please.outputs.version }} # semver, e.g. 0.1.0 or 0.2.0-beta.0
        run: |
          # The sdist is named with the PEP 440 form maturin makes of it (0.2.0b0 for 0.2.0-beta.0).
          python_version=$(printf '%s' "$VERSION" | sed -E 's/-alpha\.?/a/; s/-beta\.?/b/; s/-rc\.?/rc/')
          test -f "dist/fastpg-${python_version}.tar.gz" \
            || { echo "::error::Release ${VERSION} doesn't match the version built (from native/Cargo.toml)"; exit 1; }
          echo "python_version=$python_version" >> "$GITHUB_OUTPUT"
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  link-pypi:
    name: Link the release to PyPI
    needs:
      - release-please
      - publish
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # edit the release's notes
    steps:
      - name: Add the PyPI link to the release's notes
        # At the top of the notes Release Please wrote; once, should the job be re-run.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.publish.outputs.python_version }}
        run: |
          url="https://pypi.org/project/fastpg/$VERSION/"
          notes=$(gh release view "$TAG" --json body --jq .body)
          case $notes in *"$url"*) exit 0 ;; esac
          # shellcheck disable=SC2016 # the backquotes are Markdown's, not the shell's
          printf 'Install from [PyPI](%s): `uv add fastpg==%s`\n\n%s\n' "$url" "$VERSION" "$notes" > notes.md
          gh release edit "$TAG" --notes-file notes.md
