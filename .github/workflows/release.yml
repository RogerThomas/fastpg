# Releases with Release Please (release-please-config.json): on every push to main it opens or
# updates a release PR (the next version, from the Conventional Commits since the last release, in
# native/Cargo.toml and native/Cargo.lock, where maturin reads it from, and CHANGELOG.md); merging
# that PR tags the release and creates the GitHub release, and the same run then builds, tests and
# publishes it. (A tag made with the workflow's own token can't trigger another workflow, and PyPI
# trusts this file by name, so it all happens here.)
#
# Builds the wheels and the sdist, each uploaded with its SHA-256 as soon as it's built; tests them,
# downloaded, in jobs of their own (.github/scripts/test-wheel.sh: tests/smoke.py, then the test
# suite against the installed wheel), each wheel on the Python it's for; and when a release was
# created, once every build and test passed, publishes them all to PyPI with trusted publishing,
# checking first that each SHA-256 still matches: what's published is exactly what was tested.
# Pull requests that touch the build and manual runs build and test only. The documentation site
# is deployed by docs.yml, on every push to main that changes it (the release's version bump
# included).
#
# Wheels for CPython 3.13, 3.14 and 3.15 and the free-threaded 3.14t and 3.15t (which fastpg runs
# with the GIL back on; no 3.13t, where free threading was experimental: ADR 0011), on Linux
# (manylinux_2_28 and musllinux_1_2, x86_64 and aarch64) and macOS (x86_64 and arm64): the
# platforms ADR 0011 supports; not Windows, whose default event loop has no add_reader. Not abi3: the extension builds Structs, tuples and lists in place through CPython's
# object layouts (native/src/decode.rs, structs.rs), outside the limited API, and an abi3 wheel
# doesn't load on a free-threaded Python anyway.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    paths:
      - "native/**"
      - "src/**"
      - "tests/**"
      - "docker/**"
      - "docker-compose.yml"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - "rust-toolchain.toml"
      - ".github/scripts/**"
      - ".github/workflows/release.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  MATURIN_VERSION: v1.15.0
  UV_VERSION: 0.13.0

jobs:
  release-please:
    name: Release PR or release
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # the release, its tag and the release PR's branch
      pull-requests: write # the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Optional: with a GitHub App's token (the RELEASE_PLEASE_APP_CLIENT_ID variable and the
      # RELEASE_PLEASE_APP_PRIVATE_KEY secret), the release PR runs the PR checks, which a PR made
      # with the workflow's own token doesn't; without them, the workflow's own token.
      - id: app-token
        if: vars.RELEASE_PLEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-linux:
    name: Build ${{ matrix.platform.name }}
    needs: release-please
    if: >-
      ${{ !cancelled() && needs.release-please.result != 'failure' &&
      (github.event_name != 'push' || needs.release-please.outputs.release_created == 'true') }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Each on a runner of its own architecture (no emulation), as its test job is. The images are
        # the ones maturin-action picks for each, pinned. The manylinux ones hold every CPython
        # (cp313 to cp315t, on PATH as python3.13 ... python3.15t); for musl, maturin
        # cross-compiles with its own sysconfig data.
        platform:
          - name: manylinux x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
            container: quay.io/pypa/manylinux_2_28_x86_64@sha256:4131ddd7acb9c6c966af02fe7e71edc51e078c2d41f475966697676430bfa2ae # latest
          - name: manylinux aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: "2_28"
            container: quay.io/pypa/manylinux_2_28_aarch64@sha256:abd1230aa9e4058a74b89d27cd14ba18c0db036d7bfe6e6f219a29ea63c24eb6 # latest
          - name: musllinux x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            manylinux: musllinux_1_2
            container: ghcr.io/rust-cross/rust-musl-cross@sha256:ce75e9174325d4fbb3de85c309e2d7ca29f7500169bc4b5d2c611ff7e86d549a # x86_64-musl
          - name: musllinux aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            manylinux: musllinux_1_2
            container: ghcr.io/rust-cross/rust-musl-cross@sha256:ecae5dd62d1c938c14f8071d36c16fa699860aace03bfb5284fb1216474d2643 # aarch64-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          container: ${{ matrix.platform.container }}
          # Caches compiled crates between runs, on pull requests only: no caches in a build that
          # may be published.
          sccache: ${{ github.event_name == 'pull_request' }}
          # Listed rather than --find-interpreter, which would also take the images' PyPy.
          args: >-
            --release --locked --out dist
            --interpreter python3.13 python3.14 python3.14t python3.15 python3.15t
      - name: Record the SHA-256
        run: sh .github/scripts/sha256.sh record dist/*.whl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.platform.target }}
          path: dist/
          if-no-files-found: error

  test-linux:
    name: Test ${{ matrix.platform.name }}
    needs: build-linux
    # Explicit: on pull requests the release-please job is skipped, and a skip would otherwise
    # carry down to here even though the build ran.
    if: ${{ !cancelled() && needs.build-linux.result == 'success' }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # As build-linux: each wheel is tested natively.
        platform:
          - name: manylinux x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            libc: glibc
          - name: manylinux aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            libc: glibc
          - name: musllinux x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            libc: musl
          - name: musllinux aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            libc: musl
    env:
      ALPINE_PYTHON_314: python@sha256:f6a589d43c42b9e7f7dc67a12d37132491f362859a5d750607710cc56da3bc72 # 3.14.8-alpine
      # The compose servers (task db-up db-tls-up), as `task test-tls` reaches them.
      FASTPG_DSN: postgresql://fastpg:fastpg@127.0.0.1:55432/fastpg
      FASTPG_TLS_DSN: postgresql://fastpg:fastpg@localhost:55433/fastpg
      FASTPG_TLS_CA: docker/tls/certs/ca.crt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-${{ matrix.platform.target }}
          path: dist
      - name: Check the SHA-256
        run: sh .github/scripts/sha256.sh check dist/*.sha256
      - name: Start PostgreSQL (docker-compose.yml, and its TLS-only server)
        run: docker compose --profile tls up --detach --wait postgres postgres-tls
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: matrix.platform.libc == 'glibc'
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false # no caches in a workflow that publishes
      - name: Test (glibc)
        if: matrix.platform.libc == 'glibc'
        # On the Pythons uv downloads (python-build-standalone's). The suite in parallel, on
        # throwaway servers of its own (Docker is here); the compose ones serve the smoke test.
        env:
          UV_PYTHON_PREFERENCE: only-managed
          FASTPG_TEST_OWN_SERVERS: 1
        run: sh .github/scripts/test-wheel.sh dist 3.13 3.14 3.14t 3.15 3.15t
      - name: Test (musl, in Alpine)
        if: matrix.platform.libc == 'musl'
        # 3.14 on the Alpine image's Python, the others on ones uv downloads into the same image
        # (there's no free-threaded image). On the host's network, to reach the compose servers;
        # without Docker, so without the two test files that pause and kill a server of their
        # own. The wheels are mounted read-only.
        run: |
          for python in 3.13 3.14 3.14t 3.15 3.15t; do
            docker run --rm --network host \
              --volume "$PWD:/io" --volume "$PWD/dist:/io/dist:ro" --workdir /io \
              --env UV_VERSION --env PYTHON="$python" \
              --env UV_PYTHON_PREFERENCE="$([ "$python" = 3.14 ] && echo system || echo only-managed)" \
              --env FASTPG_DSN --env FASTPG_TLS_DSN --env FASTPG_TLS_CA \
              --env PYTEST_ADDOPTS="--ignore tests/test_network_server.py --ignore tests/test_network_stall.py" \
              "$ALPINE_PYTHON_314" sh -euxc '
                apk add --no-cache build-base
                pip install --root-user-action=ignore --disable-pip-version-check "uv==$UV_VERSION"
                sh .github/scripts/test-wheel.sh dist "$PYTHON"
              '
          done
      - name: Show the servers' logs
        if: failure()
        run: docker compose --profile tls logs postgres postgres-tls

  build-macos:
    name: Build ${{ matrix.platform.name }}
    needs: release-please
    if: >-
      ${{ !cancelled() && needs.release-please.result != 'failure' &&
      (github.event_name != 'push' || needs.release-please.outputs.release_created == 'true') }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # The x86_64 wheels are built on an arm64 runner too: it compiles for x86_64 as fast as for
        # itself, where an Intel runner takes twice as long. PyO3 doesn't count x86_64 from arm64 on
        # macOS as cross-compiling, so the arm64 Pythons below serve for both.
        platform:
          - name: macOS x86_64
            runner: macos-15
            target: x86_64-apple-darwin
          - name: macOS arm64
            runner: macos-15
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A wheel for each of these Pythons, which maturin is given by path.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python313
        with:
          python-version: "3.13"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python314
        with:
          python-version: "3.14"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python314t
        with:
          python-version: "3.14t"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python315
        with:
          python-version: "3.15"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python315t
        with:
          python-version: "3.15t"
      - name: Build
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.platform.target }}
          # As the Linux builds: pull requests only.
          sccache: ${{ github.event_name == 'pull_request' }}
          args: >-
            --release --locked --out dist --interpreter
            ${{ steps.python313.outputs.python-path }}
            ${{ steps.python314.outputs.python-path }}
            ${{ steps.python314t.outputs.python-path }}
            ${{ steps.python315.outputs.python-path }}
            ${{ steps.python315t.outputs.python-path }}
      - name: Record the SHA-256
        run: sh .github/scripts/sha256.sh record dist/*.whl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.platform.target }}
          path: dist/
          if-no-files-found: error

  test-macos:
    name: Test ${{ matrix.name }}
    needs: build-macos
    # Explicit: on pull requests the release-please job is skipped, and a skip would otherwise
    # carry down to here even though the build ran.
    if: ${{ !cancelled() && needs.build-macos.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Each wheel on its own architecture, unlike the builds.
        include:
          - { name: macOS x86_64, runner: macos-15-intel, target: x86_64-apple-darwin }
          - { name: macOS arm64, runner: macos-15, target: aarch64-apple-darwin }
    env:
      # A PostgreSQL of the runner's own (no Docker on macOS): no TLS tests (skipped), and not the
      # two test files that pause and kill a server container of their own.
      FASTPG_DSN: postgresql://fastpg:fastpg@127.0.0.1:55432/fastpg
      PYTEST_ADDOPTS: --ignore tests/test_network_server.py --ignore tests/test_network_stall.py
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist
      - name: Check the SHA-256
        run: sh .github/scripts/sha256.sh check dist/*.sha256
      - name: Start PostgreSQL 18
        run: |
          brew install postgresql@18
          PATH="$(brew --prefix postgresql@18)/bin:$PATH" \
            sh .github/scripts/native-postgres.sh "$RUNNER_TEMP/postgres" 55432
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false # no caches in a workflow that publishes
      - name: Test
        # On the Pythons uv downloads (python-build-standalone's), as on Linux: with setup-python's,
        # a request for 3.14 could find its free-threaded 3.14t, which can't load a cp314 wheel.
        env:
          UV_PYTHON_PREFERENCE: only-managed
        run: sh .github/scripts/test-wheel.sh dist 3.13 3.14 3.14t 3.15 3.15t
      - name: Show the server's log
        if: failure()
        run: cat "$RUNNER_TEMP/postgres/server.log"

  build-sdist:
    name: Build sdist
    needs: release-please
    if: >-
      ${{ !cancelled() && needs.release-please.result != 'failure' &&
      (github.event_name != 'push' || needs.release-please.outputs.release_created == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false # no caches in a workflow that publishes
      # maturin reads the crate's metadata with cargo.
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Build
        run: uv build --sdist --out-dir dist
      - name: Record the SHA-256
        run: sh .github/scripts/sha256.sh record dist/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-sdist
          path: dist/
          if-no-files-found: error

  test-sdist:
    name: Test sdist
    needs: build-sdist
    # Explicit: on pull requests the release-please job is skipped, and a skip would otherwise
    # carry down to here even though the build ran.
    if: ${{ !cancelled() && needs.build-sdist.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FASTPG_DSN: postgresql://fastpg:fastpg@127.0.0.1:55432/fastpg
      FASTPG_TLS_DSN: postgresql://fastpg:fastpg@localhost:55433/fastpg
      FASTPG_TLS_CA: docker/tls/certs/ca.crt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-sdist
          path: dist
      - name: Check the SHA-256
        run: sh .github/scripts/sha256.sh check dist/*.sha256
      - name: Start PostgreSQL (docker-compose.yml, and its TLS-only server)
        run: docker compose --profile tls up --detach --wait postgres postgres-tls
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false # no caches in a workflow that publishes
      # The sdist's rust-toolchain.toml is the checkout's.
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install
      # From the sdist alone: which fails if the sdist is missing a file.
      - name: Build a wheel from the sdist
        run: uv build --python 3.14 --wheel --out-dir wheel dist/*.tar.gz
      - name: Test the wheel built from the sdist
        env:
          UV_PYTHON_PREFERENCE: only-managed
          FASTPG_TEST_OWN_SERVERS: 1 # in parallel, as the glibc wheels' tests
        run: sh .github/scripts/test-wheel.sh wheel 3.14

  publish:
    name: Publish to PyPI
    if: needs.release-please.outputs.release_created == 'true'
    needs:
      - release-please
      - build-linux
      - build-macos
      - build-sdist
      - test-linux
      - test-macos
      - test-sdist
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/fastpg/
    permissions:
      id-token: write # PyPI trusted publishing
    outputs:
      python_version: ${{ steps.version.outputs.python_version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Check every file is what was built and tested
        working-directory: dist
        run: |
          ls -l
          for file in *.whl *.tar.gz; do
            test -f "$file.sha256" || { echo "::error::No SHA-256 recorded for $file"; exit 1; }
          done
          sha256sum --check --strict -- *.sha256
          mkdir ../checksums
          mv -- *.sha256 ../checksums/ # only the distributions are uploaded
      - name: Check the release's version is the version built
        id: version
        env:
          VERSION: ${{ needs.release-please.outputs.version }} # semver, e.g. 0.1.0 or 0.2.0-beta.0
        run: |
          # The sdist is named with the PEP 440 form maturin makes of it (0.2.0b0 for 0.2.0-beta.0).
          python_version=$(printf '%s' "$VERSION" | sed -E 's/-alpha\.?/a/; s/-beta\.?/b/; s/-rc\.?/rc/')
          test -f "dist/fastpg-${python_version}.tar.gz" \
            || { echo "::error::Release ${VERSION} doesn't match the version built (from native/Cargo.toml)"; exit 1; }
          echo "python_version=$python_version" >> "$GITHUB_OUTPUT"
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  link-pypi:
    name: Link the release to PyPI
    needs:
      - release-please
      - publish
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # edit the release's notes
    steps:
      - name: Add the PyPI link to the release's notes
        # At the top of the notes Release Please wrote; once, should the job be re-run.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.publish.outputs.python_version }}
        run: |
          url="https://pypi.org/project/fastpg/$VERSION/"
          notes=$(gh release view "$TAG" --json body --jq .body)
          case $notes in *"$url"*) exit 0 ;; esac
          # shellcheck disable=SC2016 # the backquotes are Markdown's, not the shell's
          printf 'Install from [PyPI](%s): `uv add fastpg==%s`\n\n%s\n' "$url" "$VERSION" "$notes" > notes.md
          gh release edit "$TAG" --notes-file notes.md
