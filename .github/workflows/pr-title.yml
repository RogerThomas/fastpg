# PRs are squash-merged with the PR title as the commit message, and Release Please reads those
# commits to pick the next version and write the changelog (release.yml), so the title must be a
# Conventional Commit: `feat: ...`, `fix: ...`, `perf: ...`, `docs: ...`, `feat!: ...` and so on.
# On pull_request, not pull_request_target: it only reads the title, which the read-only token of
# a PR from a fork can do too.
name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read # read the PR's title

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conventional-title:
    name: Conventional Commit title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
