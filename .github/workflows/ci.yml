# Runs the Taskfile tasks developers run locally (task lint, task typecheck, task test,
# task docs-test), so the two can't drift. uv takes Python from .python-version (or a job's
# UV_PYTHON) and rustup takes Rust from rust-toolchain.toml.
#
# On Linux the test suite runs whole. With one Python, as `task test` does locally: it starts
# its own PostgreSQL 18 containers with testcontainers (tests/conftest.py), the TLS-only one
# included. The macOS runners have no Docker: there it runs against a PostgreSQL of the runner's
# own (.github/scripts/native-postgres.sh), without the TLS tests (skipped), the pgbouncer tests
# and the two files that pause, kill and restart a server container of their own.
#
# On a pull request only the Python 3.14 tests run, on Linux x86_64 and macOS, on PostgreSQL 18.
# Pushes to main, and pull requests with the `full-ci` label, run every test: one Linux x86_64
# job for every supported Python and the other supported PostgreSQL majors (15, 16, 17), all at
# once, each serially against servers of its own, and Linux aarch64 and macOS on Python 3.14.
#
# Branch protection need only require "CI passed", which fails unless every other job passed.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    # labeled: adding the `full-ci` label starts a run with every test job.
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  TASK_VERSION: 3.54.0
  UV_LOCKED: 1 # fail if uv.lock is out of date with pyproject.toml
  UV_VERSION: 0.13.0

jobs:
  # A pull request that changes only documentation (docs/, Markdown files at the top level,
  # mkdocs.yml) skips the type-check and the test jobs: lint and the docs build still run.
  # cargo-deny runs only when the Rust dependencies, its config or this workflow change.
  # Not a workflow-level paths filter: "CI passed" is required, so it must always report.
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      test-matrix: ${{ steps.scope.outputs.test-matrix }}
      code: ${{ steps.diff.outputs.code }}
      deps: ${{ steps.diff.outputs.deps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            code=true
            deps=true
          else
            if git diff --name-only "$BASE...HEAD" | grep -qvE '^(docs/|[^/]+\.md$|mkdocs\.yml$)'; then
              code=true
            else
              code=false
            fi
            if git diff --name-only "$BASE...HEAD" |
              grep -qE '^(native/(Cargo\.toml|Cargo\.lock|deny\.toml)|\.github/workflows/ci\.yml)$'; then
              deps=true
            else
              deps=false
            fi
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"
          echo "deps=$deps" | tee -a "$GITHUB_OUTPUT"
      # The test job's matrix: on pushes to main and on pull requests with the `full-ci` label
      # the entries marked `full`, otherwise the one marked `pr` (test-macos runs on both).
      - id: scope
        env:
          FULL_CI_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
          # `all`: the job runs every supported Python and the other PostgreSQL majors, at once
          # (the test job's steps list them); otherwise Python 3.14 on PostgreSQL 18 only. Every Python on
          # Linux x86_64 only: what differs between them is how the Python code runs and how the
          # extension builds against each CPython, not the architecture, so aarch64 (and macOS,
          # test-macos) run one Python; release.yml tests every wheel natively.
          TESTS: |
            {"name": "Linux x86_64, Python 3.14", "runner": "ubuntu-24.04", "when": "pr"}
            {"name": "Linux x86_64, every Python and PostgreSQL", "runner": "ubuntu-24.04", "all": true, "when": "full"}
            {"name": "Linux aarch64, Python 3.14", "runner": "ubuntu-24.04-arm", "when": "full"}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ] || [ "$FULL_CI_LABEL" = true ]; then
            when="full"
          else
            when="pr"
          fi
          echo "Test matrix: $when"
          matrix=$(printf '%s' "$TESTS" | jq -cs --arg when "$when" 'map(select(.when == $when) | del(.when))')
          echo "test-matrix=$matrix" | tee -a "$GITHUB_OUTPUT"

  # Lint, type-check and the docs build, in one job: each step runs even if one before it
  # failed, and the job fails if any did.
  checks:
    name: Checks
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-python: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      # The Taskfile's PYO3_PYTHON is `uv python find`, which clippy's build of PyO3 needs.
      - name: Install Python (.python-version)
        run: uv python install
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: native -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The hooks' environments (actionlint is built with Go, zizmor and the pre-commit-hooks
      # installed): saved from main only, like the other caches.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Lint
        if: ${{ !cancelled() }}
        run: task lint
      - if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      # No Rust needed: pyright reads the extension's interface from src/fastpg/_native.pyi.
      - name: Type-check
        if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
        run: task typecheck
      # scripts/build_docs.py imports fastpg for the agent docs' API reference: the extension is
      # built.
      - name: Docs
        if: ${{ !cancelled() }}
        run: task docs-test

  test:
    name: Test (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # The changes job's `scope` step lists the entries.
        include: ${{ fromJSON(needs.changes.outputs.test-matrix) }}
    env:
      UV_PYTHON_PREFERENCE: only-managed # the latest patch release, not the runner's own Python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-python: true
          cache-suffix: ${{ matrix.runner }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: native -> target
          key: ${{ matrix.runner }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # One Python (pull requests, and Linux aarch64): `task test`, the Rust unit tests, then the
      # pytest suite in parallel, then its `timing` tests alone, on PostgreSQL 18, in throwaway
      # containers of its own. `uv python find` (the Taskfile's PYO3_PYTHON) reads
      # .python-version and ignores UV_PYTHON, so without the pin it looks for
      # .python-version's exact release: --no-project, written as given, for this job only; uv
      # resolves it to the latest release of that version.
      - name: Test (Python 3.14)
        if: ${{ !matrix.all }}
        env:
          UV_PYTHON: "3.14"
          UV_PROJECT_ENVIRONMENT: .venv-3.14
        run: |
          uv python pin --no-project "$UV_PYTHON"
          uv sync
          task test -- -ra
      # Every Python and PostgreSQL: each Python in a venv of its own (.venv-<python>), with the
      # extension built for it; uv downloads the Python if need be. 3.13 has no t-strings;
      # fastpg runs the free-threaded builds with the GIL back on (ADR 0011,
      # tests/test_free_threading.py). The pin is for `task test-rust`, as above.
      - name: Build (every Python)
        if: matrix.all
        run: |
          uv python pin --no-project 3.14
          for python in 3.14 3.13 3.15 3.14t 3.15t; do
            echo "::group::Python $python"
            UV_PYTHON=$python UV_PROJECT_ENVIRONMENT=.venv-$python uv sync
            echo "::endgroup::"
          done
      # A server and a TLS-only one for each Python, all PostgreSQL 18, then for 15, 16 and 17
      # (set N on ports 55432+N and 55532+N).
      - name: Start PostgreSQL
        if: matrix.all
        run: >-
          sh .github/scripts/test-servers.sh default default default default default
          postgres:15.19-trixie postgres:16.15-trixie postgres:17.11-trixie
      # All at once, each serially against servers of its own: the suite without the `timing`
      # tests on every Python, and on 3.14 against each older PostgreSQL; and the Rust unit
      # tests. The tests that need servers of their own (pgbouncer, and the ones that kill a
      # server) still start them in containers (tests/conftest.py).
      - name: Test (every Python, and PostgreSQL 15, 16 and 17)
        if: matrix.all
        env:
          FASTPG_TEST_TLS: 1
          SUITE: uv run --no-sync pytest -n0 -p no:cacheprovider -ra -m "not timing"
        run: >-
          sh .github/scripts/parallel.sh
          "Python 3.14" "UV_PYTHON=3.14 UV_PROJECT_ENVIRONMENT=.venv-3.14 sh .github/scripts/with-server.sh 0 $SUITE"
          "Python 3.13" "UV_PYTHON=3.13 UV_PROJECT_ENVIRONMENT=.venv-3.13 sh .github/scripts/with-server.sh 1 $SUITE"
          "Python 3.15" "UV_PYTHON=3.15 UV_PROJECT_ENVIRONMENT=.venv-3.15 sh .github/scripts/with-server.sh 2 $SUITE"
          "Python 3.14t" "UV_PYTHON=3.14t UV_PROJECT_ENVIRONMENT=.venv-3.14t sh .github/scripts/with-server.sh 3 $SUITE"
          "Python 3.15t" "UV_PYTHON=3.15t UV_PROJECT_ENVIRONMENT=.venv-3.15t sh .github/scripts/with-server.sh 4 $SUITE"
          "PostgreSQL 15" "UV_PYTHON=3.14 UV_PROJECT_ENVIRONMENT=.venv-3.14 FASTPG_PG_IMAGE=postgres:15.19-trixie sh .github/scripts/with-server.sh 5 $SUITE"
          "PostgreSQL 16" "UV_PYTHON=3.14 UV_PROJECT_ENVIRONMENT=.venv-3.14 FASTPG_PG_IMAGE=postgres:16.15-trixie sh .github/scripts/with-server.sh 6 $SUITE"
          "PostgreSQL 17" "UV_PYTHON=3.14 UV_PROJECT_ENVIRONMENT=.venv-3.14 FASTPG_PG_IMAGE=postgres:17.11-trixie sh .github/scripts/with-server.sh 7 $SUITE"
          "Rust unit tests" "task test-rust"
      # Then the `timing` tests, alone, on 3.14 and PostgreSQL 18.
      - name: Test (the timing tests, Python 3.14)
        if: ${{ !cancelled() && matrix.all }}
        env:
          FASTPG_TEST_TLS: 1
          UV_PYTHON: "3.14"
          UV_PROJECT_ENVIRONMENT: .venv-3.14
        run: sh .github/scripts/with-server.sh 0 uv run --no-sync pytest -ra -m timing
      - name: Show the servers' logs
        if: failure() && matrix.all
        run: |
          for n in 0 1 2 3 4 5 6 7; do
            docker compose --project-name "fastpg-test-$n" --profile tls logs postgres postgres-tls
          done

  test-macos:
    name: Test (macOS arm64, Python 3.14)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15
    timeout-minutes: 40
    env:
      FASTPG_DSN: postgresql://fastpg:fastpg@127.0.0.1:55432/fastpg
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-python: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: native -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build (uv sync)
        run: uv sync
      # The major version docker-compose.yml's image is (postgres:18.6-trixie).
      - name: Start PostgreSQL 18
        run: |
          brew install postgresql@18
          echo "$(brew --prefix postgresql@18)/bin" >> "$GITHUB_PATH"
          PATH="$(brew --prefix postgresql@18)/bin:$PATH" \
            sh .github/scripts/native-postgres.sh "$RUNNER_TEMP/postgres" 55432
      # Serially: every worker would share this one server (not yet reliable in parallel).
      - name: Test
        run: >-
          task test PARALLEL=-n0 -- -ra --ignore tests/test_pgbouncer.py
          --ignore tests/test_network_server.py --ignore tests/test_network_stall.py
      - name: Show the server's log
        if: failure()
        run: cat "$RUNNER_TEMP/postgres/server.log"

  # Known vulnerabilities (RustSec), licences, duplicate versions and sources of the Rust
  # dependencies, as native/deny.toml sets out.
  deny:
    name: Dependencies (cargo-deny)
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: native/Cargo.toml

  ci-passed:
    name: CI passed
    if: always()
    needs: [changes, checks, test, test-macos, deny]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Skipped is fine only where `changes` meant it: the test jobs for a documentation-only
      # change, and cargo-deny when the Rust dependencies didn't change. A job skipped because
      # one it needs failed shows up as that failure (and if `changes` fails, its outputs are
      # empty, so no skip counts as meant).
      - name: Check every job passed (or was skipped because the change doesn't need it)
        env:
          NEEDS: ${{ toJSON(needs) }}
          CODE: ${{ needs.changes.outputs.code }}
          DEPS: ${{ needs.changes.outputs.deps }}
        run: |
          echo "Code changed: $CODE, Rust dependencies changed: $DEPS"
          for job_result in $(printf '%s' "$NEEDS" | jq -r 'to_entries[] | "\(.key)=\(.value.result)"'); do
            job=${job_result%%=*}
            result=${job_result#*=}
            echo "$job: $result"
            case "$job/$result" in
              */success) continue ;;
              test/skipped | test-macos/skipped) [ "$CODE" = false ] && continue ;;
              deny/skipped) [ "$DEPS" = false ] && continue ;;
            esac
            echo "::error::$job ended with: $result"
            exit 1
          done
