# Cross-driver benchmarks: fastpg vs asyncpg, psycopg 3 (async) and psqlpy (bench/compare.py).
# Methodology and limitations: docs/benchmarks.md. Reproduce locally: `task db-up bench-ci`.
#
# Not run on push or pull requests: a full run takes ~25-30 minutes of a shared runner, and
# run-to-run noise on hosted runners is larger than most single-commit changes, so a
# per-commit number would mostly measure the neighbours. The weekly run catches drift (new
# driver releases come in through the lock file); dispatch it by hand before a release or
# after a performance change. The job fails only if a run crashes or a driver returns or
# writes wrong data, never because of the numbers.
name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      trials:
        description: Trials (each runs every workload for every driver configuration)
        default: "3"
        type: string
      duration:
        description: Measured seconds per run
        default: "3"
        type: string
      warmup:
        description: Warm-up seconds per run
        default: "1"
        type: string
      workloads:
        description: Workload names or globs, space-separated (empty runs all; see `--list`)
        default: ""
        type: string
  schedule:
    - cron: "23 4 * * 1" # Mondays 04:23 UTC

permissions:
  contents: read

concurrency:
  group: benchmarks
  cancel-in-progress: false

jobs:
  compare:
    name: Compare drivers
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    services:
      postgres:
        # Same image as docker-compose.yml. Defaults otherwise (max_connections=100 is
        # plenty: one pool of 16 at a time plus two control connections).
        image: postgres:18.6-trixie
        env:
          POSTGRES_USER: fastpg
          POSTGRES_PASSWORD: fastpg
          POSTGRES_DB: fastpg
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U fastpg -d fastpg"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DSN: postgresql://fastpg:fastpg@127.0.0.1:55432/fastpg
      OUT: bench-results
      TRIALS: ${{ inputs.trials || '3' }}
      DURATION: ${{ inputs.duration || '3' }}
      WARMUP: ${{ inputs.warmup || '1' }}
      WORKLOADS: ${{ inputs.workloads || '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native -> target

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.24" # same uv as docker/Dockerfile.test
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            native/Cargo.lock

      - name: Build fastpg (release, via maturin) and install every dependency group
        run: uv sync --locked --all-groups

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Durability is irrelevant to a client benchmark, and a commit flush to the runner's
      # disk would dominate the single-row writes; JIT only adds jitter to these plans.
      # docker-compose.yml sets the same two (plus more), as server flags.
      - name: Configure PostgreSQL (synchronous_commit=off, jit=off)
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U fastpg -d fastpg -v ON_ERROR_STOP=1 \
            -c "ALTER SYSTEM SET synchronous_commit = off" \
            -c "ALTER SYSTEM SET jit = off" \
            -c "SELECT pg_reload_conf()"
          docker exec ${{ job.services.postgres.id }} psql -U fastpg -d fastpg -Atc \
            "SELECT name || '=' || setting FROM pg_settings WHERE name IN ('synchronous_commit', 'jit', 'max_connections', 'shared_buffers')"

      - name: Run the comparison
        run: |
          set -f # workload globs reach the script unexpanded
          args=()
          for workload in $WORKLOADS; do args+=(-k "$workload"); done
          task bench-ci DSN="$DSN" TRIALS="$TRIALS" DURATION="$DURATION" WARMUP="$WARMUP" \
            OUT="$OUT" SUMMARY="$GITHUB_STEP_SUMMARY" -- "${args[@]}"

      - name: Upload raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OUT }}/
          if-no-files-found: warn
          retention-days: 90
