# Runs cargo-deny once a week, so a new RustSec advisory against a Rust dependency that
# hasn't changed shows up. CI runs it only when the Rust dependencies change. Same
# invocation as the "Dependencies (cargo-deny)" job in ci.yml: keep the two in step.
name: cargo-deny (weekly)

on:
  schedule:
    - cron: "17 5 * * 1" # Mondays 05:17 UTC, clear of benchmarks.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deny:
    name: Dependencies (cargo-deny)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: native/Cargo.toml
