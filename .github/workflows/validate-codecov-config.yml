# Checks codecov.yml with Codecov's validator whenever it changes (Codecov otherwise ignores an
# invalid one without saying so). Locally:
# `curl -sS --fail-with-body --data-binary @codecov.yml https://codecov.io/validate`.
name: Validate codecov.yml

on:
  push:
    branches: [main]
    paths: [codecov.yml]
  pull_request:
    paths: [codecov.yml]

permissions:
  contents: read

jobs:
  validate:
    name: Validate codecov.yml
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: curl -sS --fail-with-body --retry 3 --data-binary @codecov.yml https://codecov.io/validate
