# Throwaway (deleted before the PR is ready): fastpg built from source vs the PGO wheel of
# Release run 42660268999, on one x86_64 runner, alternating, so both see the same CPU.
name: Throwaway PGO A/B

on:
  push:
    branches: [perf/pgo-release]
    paths: [.github/workflows/tmp-pgo-ab.yml]

permissions:
  contents: read
  actions: read

jobs:
  ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:18.6-trixie
        env:
          POSTGRES_USER: fastpg
          POSTGRES_PASSWORD: fastpg
          POSTGRES_DB: fastpg
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U fastpg -d fastpg"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      FASTPG_DSN: postgresql://fastpg:fastpg@127.0.0.1:55432/fastpg
      UV_LOCKED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.0
          enable-cache: false
      - run: uv sync --all-groups
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-x86_64-unknown-linux-gnu
          path: release-wheels
          run-id: 42660268999
          github-token: ${{ github.token }}
      - run: |
          UV_PROJECT_ENVIRONMENT=.venv-pgo uv sync --all-groups --no-install-project
          uv pip install --python .venv-pgo release-wheels/fastpg-*-cp314-cp314-manylinux*.whl
          for env in .venv .venv-pgo; do
            UV_PROJECT_ENVIRONMENT=$env uv run --no-sync python -c 'import fastpg, sys; print(sys.prefix, fastpg.__file__)'
          done
      - env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" psql -U fastpg -d fastpg -v ON_ERROR_STOP=1 \
            -c "ALTER SYSTEM SET synchronous_commit = off" -c "ALTER SYSTEM SET jit = off" \
            -c "SELECT pg_reload_conf()"
      - name: A/B, alternating
        run: |
          grep -m1 'model name' /proc/cpuinfo
          order="source pgo"
          for round in 1 2 3; do
            for v in $order; do
              env=.venv
              [ "$v" = pgo ] && env=.venv-pgo
              echo "::group::round $round: $v"
              UV_PROJECT_ENVIRONMENT=$env uv run --no-sync yeet ./bench/compare.py -n 2 -t 3 -w 1 \
                -k point-c1 -k point-c16 -k point-c64 -k point-c16-typed -k page-20-c16 \
                -k fetch-1000-c4 -k insert-c16 -k update-c16 -k transaction-c16 \
                -k executemany-1000 -k copy-5000 \
                -d fastpg -d asyncpg -d asyncpg-noreset -o "ab/$v-$round"
              echo "::endgroup::"
            done
            [ "$order" = "source pgo" ] && order="pgo source" || order="source pgo"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ab
          path: ab/
