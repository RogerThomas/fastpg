# Weekly, one grouped PR per ecosystem, each a week behind the latest releases (cooldown), titled
# as a Conventional Commit (pr-title.yml checks it; Release Please reads it).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /native
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo:
        patterns: ["*"]
    # fastpg passes these crates' types to and from xitca-postgres (and postgres-protocol), so
    # they must stay on the versions xitca-postgres itself uses: two copies of one crate don't
    # share traits. Below 1.0 a minor bump is a breaking one; move them by hand, together with
    # xitca-postgres.
    ignore:
      - dependency-name: xitca-io
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: fallible-iterator
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: postgres-protocol
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      uv:
        patterns: ["*"]
