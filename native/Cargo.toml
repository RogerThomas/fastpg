[package]
name = "fastpg-native"
version = "0.1.2"
edition = "2024"
license = "MIT"
rust-version = "1.88"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[features]
# Count Rust heap allocations (exposed as `_native.rust_allocations()`); used by the benchmarks.
alloc-stats = []

[dependencies]
bytes = "1"
fallible-iterator = "0.2"
pyo3 = "0.30"
itoa = "1"
# `clock_gettime` on a clock that counts sleep (`router.rs`).
libc = "0.2"
percent-encoding = "2"
postgres-protocol = "0.6"
rmp = "0.8"
# TLS (`tls.rs`): rustls with the ring provider; system roots, with Mozilla's as fallback.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
ryu = "1"
serde_json = "1"
sha2 = "0.11"
# Sync primitives and `select!` only: fastpg runs no tokio runtime (see `event_loop.rs`).
tokio = { version = "1.48", features = ["sync", "macros"] }
webpki-roots = "1"
xitca-io = { version = "0.5.1", features = ["runtime"] }
xitca-postgres = "0.4"

[build-dependencies]
# `build.rs`: the `Py_3_*` cfgs of the Python being built for.
pyo3-build-config = { version = "0.30", features = ["resolve-config"] }

[lints.clippy]
expect_used = "deny"
panic = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
